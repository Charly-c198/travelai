# TravelAI 前端生产部署 nginx 配置
# 用法：把 `npm run build` 产物 dist/ 的内容部署到 root 指向的目录（如 /usr/share/nginx/html）
# 作用：
#   - history 模式 SPA 回退（避免刷新 / 深链 404）
#   - 静态资源长缓存
#   - 把 /api 反向代理到后端 FastAPI（并关闭缓冲以支持 SSE 流式）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA：history 模式回退到 index.html，避免刷新/直接访问子路由 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 构建产物静态资源（默认带 /assets/ 前缀）：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 关键：关闭代理缓冲，否则 Phase 1 的 SSE 流式响应会被 nginx 缓冲截断/延迟
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SSE/长连接超时放宽（默认 60s 会掐断长生成任务）
        proxy_read_timeout 300s;
    }
}